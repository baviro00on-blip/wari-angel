<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>もののかぞえかたクイズ２</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec;
    --paper:#ffffff;
    --ink:#3b2f2a;
    --sub:#8a7568;
    --line:#f0e1cc;
    --orange:#ff8a3d;
    --orange-d:#e56d1f;
    --green:#3fb56b;
    --green-bg:#e4f7eb;
    --red:#ef5a5a;
    --red-bg:#fde8e8;
    --blue:#4a8fe0;
    --blue-d:#2f6db8;
    --purple:#7c4dff;
    --purple-d:#5932c9;
    --yellow:#ffd23f;
    --c1:#ffe3cc; --c2:#dff1ff; --c3:#e6f6df; --c4:#f6e3fb;
    --radius:24px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    color:var(--ink);
    background:var(--bg);
    background-image:radial-gradient(#ffe7c7 1.5px, transparent 1.5px);
    background-size:28px 28px;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow-x:hidden;
    transition:background-color .1s;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  rt{font-size:.45em;font-weight:700;color:var(--sub);letter-spacing:0}
  body.no-ruby .name rt, body.no-ruby .name rp{display:none}

  /* 50枚コンプリート時の高速7色背景アニメーション */
  body.celebrate-rainbow{
    background-image:none !important;
    animation:rainbow7Bg 0.7s steps(1) infinite !important;
  }
  @keyframes rainbow7Bg{
    0%   { background-color:#ff3b30; } /* 赤 */
    14.2%{ background-color:#ff9500; } /* 橙 */
    28.5%{ background-color:#ffcc00; } /* 黄 */
    42.8%{ background-color:#34c759; } /* 緑 */
    57.1%{ background-color:#00c7be; } /* 水 */
    71.4%{ background-color:#007aff; } /* 青 */
    85.7%{ background-color:#af52de; } /* 紫 */
    100% { background-color:#ff3b30; }
  }

  /* 誤答時の画面揺れアニメーション */
  @keyframes screenShake{
    0%, 100%{ transform:translateX(0); }
    15%, 55%, 85%{ transform:translateX(-12px) rotate(-0.6deg); }
    35%, 70%{ transform:translateX(12px) rotate(0.6deg); }
  }
  .shake-screen{
    animation:screenShake 0.42s ease-in-out;
  }

  @keyframes popIn{
    0%{ transform:scale(.5); opacity:0; }
    70%{ transform:scale(1.06); }
    100%{ transform:scale(1); opacity:1; }
  }
  .pop-in{ animation:popIn 0.32s cubic-bezier(.18,.89,.32,1.28) forwards; }

  .app{
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    max-width:1100px;margin:0 auto;padding:clamp(12px,2.2vw,24px);position:relative;z-index:2;
  }
  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}

  /* 共通：どこでも表示される「ずかん」ボタン */
  .zukan-nav-btn{
    border:2px solid #c7d2fe;
    background:linear-gradient(135deg,#5b46e8,#7c3aed);
    color:#fff;
    border-radius:16px;
    padding:8px 14px;
    font-size:clamp(14px,2.1vw,18px);
    font-weight:900;
    box-shadow:0 4px 0 #3f2ab8;
    display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;
    transition:transform .08s;
  }
  .zukan-nav-btn:active{transform:translateY(3px);box-shadow:none}
  .zukan-badge{
    background:#ffd23f;color:#3b2f2a;
    border-radius:999px;padding:2px 8px;
    font-size:.85em;font-weight:900;
  }

  /* ---------- start ---------- */
  .start{align-items:center;justify-content:center;text-align:center;gap:clamp(12px,2.4vh,24px);position:relative}
  .start-top-bar{
    width:100%;display:flex;justify-content:flex-end;align-items:center;
  }
  .logo-emojis{font-size:clamp(42px,7.5vw,74px);line-height:1;letter-spacing:.1em}
  h1{margin:0;font-weight:900;font-size:clamp(32px,6vw,60px);line-height:1.22}
  h1 .hl{color:var(--orange)}
  .lead{margin:0;font-size:clamp(16px,2.4vw,22px);color:var(--sub);font-weight:700}

  .card{
    background:var(--paper);border-radius:var(--radius);box-shadow:0 6px 0 var(--line);
    padding:clamp(18px,3vw,28px);width:min(620px,100%);
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .status-pill{
    background:#fff5e4;border:2px solid #ffd599;border-radius:999px;
    padding:6px 18px;font-size:clamp(15px,2.2vw,19px);font-weight:900;color:var(--orange-d);
  }

  /* 「つづきから」(大きいボタン) & 「リセット」(小さいボタン) */
  .continue-btn{
    width:100%;max-width:440px;
    border:none;border-radius:24px;
    padding:clamp(20px,3.2vw,28px) 20px;
    font-size:clamp(28px,4.8vw,42px);font-weight:900;
    color:#fff;
    background:linear-gradient(180deg,#ff9a4d,#ff771c);
    box-shadow:0 8px 0 var(--orange-d);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    transition:transform .08s, box-shadow .08s;
  }
  .continue-btn small{
    font-size:clamp(14px,2vw,18px);font-weight:700;opacity:.95;
  }
  .continue-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--orange-d)}

  .menu-sub-row{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-top:4px;
  }
  .toggles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .toggle{
    border:3px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;
    font-size:clamp(15px,2vw,18px);font-weight:700;display:flex;align-items:center;gap:7px
  }
  .toggle .dot{width:20px;height:20px;border-radius:50%;background:#ddd;transition:.15s}
  .toggle.on{border-color:var(--orange)}
  .toggle.on .dot{background:var(--orange)}

  .reset-btn{
    border:2px solid #f5b7b7;background:#fff5f5;color:#c73636;
    border-radius:14px;padding:7px 14px;
    font-size:clamp(13px,1.8vw,15px);font-weight:900;
    box-shadow:0 3px 0 #f2c6c6;
    transition:transform .08s;
  }
  .reset-btn:active{transform:translateY(2px);box-shadow:none}

  /* ---------- quiz ---------- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:clamp(10px,2vh,18px);flex-wrap:wrap}
  .home-btn{
    border:none;background:#fff;border-radius:16px;width:50px;height:50px;font-size:24px;
    box-shadow:0 4px 0 var(--line);flex:none;display:flex;align-items:center;justify-content:center;
  }
  .home-btn:active{transform:translateY(3px);box-shadow:none}
  .progress{flex:1;min-width:90px;height:20px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 3px var(--line)}
  .progress > div{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .35s}
  .qnum{font-weight:900;font-size:clamp(16px,2.4vw,22px);white-space:nowrap}

  .quiz-body{flex:1;display:grid;gap:clamp(14px,2.5vw,24px);grid-template-columns:1fr;align-content:start}
  .question{
    background:var(--paper);border-radius:var(--radius);box-shadow:0 6px 0 var(--line);
    padding:clamp(16px,2.8vw,28px);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    position:relative;
  }
  .retry-tag{
    background:#fff0f0;border:2px solid #f7a8a8;color:#c73636;
    font-size:14px;font-weight:900;padding:3px 12px;border-radius:999px;
  }
  .q-emoji{font-size:clamp(60px,12vw,120px);line-height:1.1}
  .ill{width:1.45em;height:1.2em;vertical-align:middle;display:inline-block}
  .name{font-size:clamp(26px,4.8vw,46px);font-weight:900;line-height:1.5}
  .q-text{font-size:clamp(18px,2.6vw,24px);font-weight:700;color:var(--sub)}
  .q-text b{color:var(--orange-d)}
  .wrong-banner{
    min-height:28px;font-size:clamp(15px,2.2vw,19px);font-weight:900;color:#d63031;
    opacity:0;transition:opacity .15s;
  }
  .wrong-banner.show{opacity:1}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,20px)}
  .choice{
    border:none;border-radius:var(--radius);min-height:clamp(105px,16vh,165px);
    font-size:clamp(44px,7.5vw,72px);font-weight:900;line-height:1.3;
    display:flex;align-items:center;justify-content:center;position:relative;
    transition:transform .08s, box-shadow .08s, background-color .15s;
  }
  .choice:nth-child(1){background:var(--c1);box-shadow:0 7px 0 #f3c49d}
  .choice:nth-child(2){background:var(--c2);box-shadow:0 7px 0 #a9d2f1}
  .choice:nth-child(3){background:var(--c3);box-shadow:0 7px 0 #b4dda6}
  .choice:nth-child(4){background:var(--c4);box-shadow:0 7px 0 #dcb5ea}
  .choice:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 #0001}
  .choice:disabled{cursor:default}
  .choice rt{font-size:.36em;color:var(--ink);opacity:.75}
  .choice.correct{background:var(--green)!important;color:#fff;box-shadow:0 7px 0 #2a8a4d!important}
  .choice.correct rt{color:#fff;opacity:1}
  .choice.wrong{background:var(--red)!important;color:#fff;box-shadow:0 7px 0 #c23d3d!important}
  .choice.wrong rt{color:#fff;opacity:1}
  .choice .mark{position:absolute;top:8px;right:14px;font-size:.5em}

  /* ---------- かぞえかたカード デザイン（どうぶつカード準拠） ---------- */
  .kazoekata-card{
    border-radius:20px;
    padding:10px;
    background:linear-gradient(160deg,#3b2618 0%,#633b1e 50%,#29190e 100%);
    border:4px solid #fbbf24;
    box-shadow:0 8px 20px rgba(0,0,0,0.35), inset 0 0 12px rgba(251,191,36,0.45);
    color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;overflow:hidden;
    text-align:left;
  }
  /* キラキラ光沢（ホログラム） */
  .kazoekata-card::after{
    content:'';position:absolute;top:-100%;left:-100%;width:300%;height:300%;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.32) 48%,rgba(255,220,100,0.28) 52%,transparent 70%);
    transform:rotate(25deg);pointer-events:none;
    animation:cardFoil 4.5s infinite linear;
  }
  @keyframes cardFoil{
    0%{transform:translateY(-25%) rotate(25deg)}
    100%{transform:translateY(25%) rotate(25deg)}
  }

  /* 1. 動物名のところ → 出題された物の名称 */
  .kc-header{
    display:flex;justify-content:space-between;align-items:center;gap:4px;
    border-bottom:1.5px solid rgba(255,255,255,0.25);
    padding-bottom:4px;z-index:1;
  }
  .kc-item-name{
    font-weight:900;color:#fde68a;
    line-height:1.35;
    word-break:break-word;
  }
  .kc-item-name rt{color:#fef3c7;font-size:.52em}
  .kc-no-badge{
    background:#f59e0b;color:#29190e;
    font-weight:900;border-radius:999px;padding:2px 7px;
    white-space:nowrap;flex:none;
  }

  /* 2. 動物の絵の部分 → 正解した問題のイラスト */
  .kc-art{
    margin:6px 0;
    border-radius:14px;
    background:linear-gradient(180deg,#fffbeb 0%,#ffffff 60%,#e0f2fe 100%);
    border:2px solid rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.12);
    z-index:1;overflow:hidden;
  }

  /* 3. 動物の説明の部分 → ふりがな付きで「1頭」など（文字サイズ特大！） */
  .kc-desc{
    background:rgba(20,12,8,0.85);
    border:1.5px solid rgba(255,255,255,0.2);
    border-radius:12px;
    padding:6px 8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:1;
  }
  .kc-counter-big{
    font-weight:900;
    color:#ffffff;
    line-height:1.45;
    letter-spacing:.02em;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  .kc-counter-big rt{
    color:#ffd23f;
    font-size:.46em;
    font-weight:900;
  }
  .kc-sub-note{
    color:#cbd5e1;
    font-weight:700;
    line-height:1.3;
    margin-top:2px;
  }

  /* カードサイズバリエーション（獲得モーダル用・拡大用 vs 図鑑4列一覧用） */
  .kazoekata-card.size-lg{
    width:min(290px, 78vw);
    min-height:360px;
    padding:14px;
  }
  .size-lg .kc-item-name{ font-size:clamp(18px, 4.2vw, 22px); }
  .size-lg .kc-no-badge{ font-size:12px; }
  .size-lg .kc-art{ height:145px; font-size:84px; }
  .size-lg .kc-desc{ min-height:110px; padding:10px; }
  .size-lg .kc-counter-big{ font-size:clamp(34px, 7.5vw, 44px); }
  .size-lg .kc-sub-note{ font-size:12px; }

  /* 図鑑の4列グリッド用コンパクトサイズ（スマホでも1列4枚でしっかり読める） */
  .kazoekata-card.size-grid{
    width:100%;
    height:100%;
    min-height:clamp(175px, 28vw, 240px);
    padding:clamp(6px, 1.2vw, 10px);
    border-width:3px;
    border-radius:14px;
  }
  .size-grid .kc-header{ padding-bottom:3px; }
  .size-grid .kc-item-name{ font-size:clamp(10px, 1.9vw, 14px); line-height:1.3; }
  .size-grid .kc-no-badge{ font-size:clamp(8px, 1.3vw, 11px); padding:1px 5px; }
  .size-grid .kc-art{
    margin:4px 0;
    height:clamp(54px, 10vw, 88px);
    font-size:clamp(32px, 6vw, 52px);
    border-radius:10px;
  }
  .size-grid .kc-desc{
    padding:4px 3px;
    border-radius:9px;
    flex:1;
  }
  .size-grid .kc-counter-big{
    font-size:clamp(17px, 3.2vw, 26px);
    line-height:1.4;
  }
  .size-grid .kc-sub-note{ display:none; }

  /* ---------- モーダル共通 ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,15,12,0.78);
    backdrop-filter:blur(3px);
    z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;
  }
  .modal-backdrop.show{display:flex}

  .modal-box{
    background:#fff;border-radius:28px;border:4px solid var(--orange);
    box-shadow:0 12px 35px rgba(0,0,0,0.4);
    padding:clamp(18px,3vw,28px);
    max-width:440px;width:100%;
    text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    position:relative;
  }
  .get-title{
    font-size:clamp(20px,3.8vw,27px);font-weight:900;color:var(--orange-d);
    line-height:1.45;margin:0;
  }
  .get-title rt{color:var(--sub);font-size:.48em}
  .get-sub{
    font-size:clamp(14px,2.2vw,17px);font-weight:700;color:var(--sub);margin:0;
  }
  .modal-btn-row{
    width:100%;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px;
  }
  .next-btn{
    flex:1;min-width:160px;
    border:none;background:var(--green);color:#fff;border-radius:20px;padding:15px 22px;
    font-size:clamp(20px,3vw,26px);font-weight:900;box-shadow:0 6px 0 #2a8a4d;
    transition:transform .08s;
  }
  .next-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #2a8a4d}

  /* リセット確認ダイアログ */
  .confirm-msg{
    font-size:clamp(22px,4vw,28px);font-weight:900;color:var(--ink);margin:8px 0;line-height:1.4;
  }
  .btn-danger{
    border:none;background:var(--red);color:#fff;border-radius:18px;padding:14px 24px;
    font-size:clamp(18px,2.8vw,22px);font-weight:900;box-shadow:0 5px 0 #b83232;flex:1;
  }
  .btn-danger:active{transform:translateY(4px);box-shadow:none}
  .btn-cancel{
    border:none;background:#e2e8f0;color:var(--ink);border-radius:18px;padding:14px 24px;
    font-size:clamp(18px,2.8vw,22px);font-weight:900;box-shadow:0 5px 0 #cbd5e1;flex:1;
  }
  .btn-cancel:active{transform:translateY(4px);box-shadow:none}

  /* ---------- 図鑑（ずかん）画面 ---------- */
  .zukan-overlay{
    position:fixed;inset:0;background:#1e1b2e;color:#fff;
    z-index:50;display:none;flex-direction:column;
  }
  .zukan-overlay.show{display:flex}
  .zukan-header{
    background:#2a2540;border-bottom:3px solid #4c4375;
    padding:12px clamp(12px,2.5vw,24px);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    max-width:1100px;width:100%;margin:0 auto;
  }
  .zukan-title{
    margin:0;font-size:clamp(18px,3.2vw,26px);font-weight:900;color:#fde68a;
    display:flex;align-items:center;gap:8px;
  }
  .zukan-back-btn{
    border:none;background:#ffd23f;color:#29190e;
    border-radius:16px;padding:10px 18px;
    font-size:clamp(15px,2.3vw,19px);font-weight:900;
    box-shadow:0 4px 0 #d4a317;white-space:nowrap;
  }
  .zukan-back-btn:active{transform:translateY(3px);box-shadow:none}

  .zukan-scroll{
    flex:1;overflow-y:auto;padding:clamp(10px,2vw,20px);
    max-width:1100px;width:100%;margin:0 auto;
  }
  /* 1列に4枚、12行＋2枚（合計50枚）の固定グリッド */
  .zukan-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:clamp(6px, 1.5vw, 14px);
    padding-bottom:30px;
  }
  .zukan-slot{
    cursor:pointer;
    transition:transform .12s;
  }
  .zukan-slot:active{transform:scale(0.96)}

  .locked-card{
    width:100%;height:100%;
    min-height:clamp(175px, 28vw, 240px);
    border-radius:14px;
    background:#28243d;
    border:3px dashed #4c4375;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:#8e86b3;text-align:center;padding:6px;
  }
  .locked-icon{font-size:clamp(26px, 4.5vw, 40px)}
  .locked-no{font-size:clamp(11px, 1.8vw, 14px);font-weight:900;color:#a59ec9}
  .locked-q{font-size:clamp(12px, 2vw, 16px);font-weight:900}

  /* ---------- 50枚コンプリート ド派手お祝い画面 ---------- */
  .celebrate-screen{
    align-items:center;justify-content:center;text-align:center;
    gap:clamp(14px,2.5vh,24px);padding:16px;
  }
  .celebrate-card{
    background:rgba(255,255,255,0.95);
    border:6px solid #ffd23f;
    border-radius:32px;
    padding:clamp(22px,4vw,40px);
    max-width:640px;width:100%;
    box-shadow:0 14px 40px rgba(0,0,0,0.35);
    display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .celebrate-trophy{
    font-size:clamp(72px,14vw,120px);line-height:1;
    animation:trophyBounce 0.8s infinite alternate ease-in-out;
  }
  @keyframes trophyBounce{
    from{transform:translateY(0) scale(1)}
    to{transform:translateY(-14px) scale(1.12)}
  }
  .celebrate-title{
    margin:0;font-size:clamp(28px,5.2vw,46px);font-weight:900;
    background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981,#3b82f6,#8b5cf6);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:1.3;
  }
  .celebrate-desc{
    margin:0;font-size:clamp(17px,2.8vw,23px);font-weight:900;color:var(--ink);line-height:1.6;
  }
  .rechallenge-btn{
    border:none;border-radius:22px;padding:18px 32px;
    font-size:clamp(22px,3.6vw,30px);font-weight:900;color:#fff;
    background:linear-gradient(180deg,#ff8a3d,#e56d1f);
    box-shadow:0 7px 0 #b84d0b;
    transition:transform .08s;
  }

    <path d="M18 33 h40" stroke="#f3cf9c" stroke-width="2"/>`,

    return `<rect x="24" y="10" width="72" height="72" rx="4" fill="#b87a42" stroke="#7a4c22" stroke-width="2.5"/>${d}
    <rect x="26" y="82" width="10" height="8" fill="#7a4c22"/><rect x="84" y="82" width="10" height="8" fill="#7a4c22"/>`; })(),
  dozen: (()=>{ const cols=["#ef5a5a","#ff9f43","#ffd23f","#3fb56b","#4a8fe0","#9b6ad6"]; let p="";

const icon = e => e.startsWith("svg:") ? SVG_HEAD + ILL[e.slice(4)] + "</svg>" : e;

/* ===== べんりな かんすう ===== */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const nameHTML = s => s.replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rp>(</rp><rt>$2</rt><rp>)</rp></ruby>');
const ctrHTML = c => READ[c] ? `<ruby>${c}<rp>(</rp><rt>${READ[c]}</rt><rp>)</rp></ruby>` : c;
const CARD_READ_OVERRIDE = { "杯": "ぱい", "匹": "ぴき", "本": "ぽん" };
const oneCtrHTML = c => {
  const r = CARD_READ_OVERRIDE[c] || READ[c];
  return r ? `1<ruby>${c}<rp>(</rp><rt>${r}</rt><rp>)</rp></ruby>` : `1${c}`;
};

/* ===== おと（ブブッ音・正解・ファンファーレ・花火ヒューッ＆ドドン） ===== */
let soundOn = true, rubyOn = true, actx = null;
function getAudioCtx(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === "suspended") actx.resume();
  return actx;
}

function beep(notes){
  if(!soundOn) return;
  try{
    const ctx = getAudioCtx();
    let t = ctx.currentTime;
    notes.forEach(([f,d,type,vol])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(vol || .25, t+.015);
      g.gain.exponentialRampToValueAtTime(.0001, t+d);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t+d+.02);
      t += d*.85;
    });
  }catch(e){}
}

const sndOK = () => beep([[784,.13,"sine",.26],[1047,.26,"sine",.28]]);

/* 50枚コンプリート時の豪華ファンファーレ */
function sndGrandFanfare(){
  if(!soundOn) return;
  try{
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const seq = [
      {f:523.25, t:0.00, d:0.14},
      {f:659.25, t:0.13, d:0.14},
      {f:783.99, t:0.26, d:0.14},
      {f:1046.5, t:0.40, d:0.32},
      {f:783.99, t:0.74, d:0.15},
      {f:1046.5, t:0.92, d:0.75},
      {f:1318.5, t:0.92, d:0.75},
      {f:1568.0, t:0.92, d:0.75}
    ];
    seq.forEach(n=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(n.f, now + n.t);
      g.gain.setValueAtTime(0.001, now + n.t);
      g.gain.exponentialRampToValueAtTime(0.24, now + n.t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
      o.connect(g).connect(ctx.destination);
      o.start(now + n.t);
      o.stop(now + n.t + n.d + 0.03);
    });
  }catch(e){}
}

/* 花火の音（ヒューッ、ドドン！） */
function sndFirework(){
  if(!soundOn) return;
  try{
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // 1. 「ヒューッ」（打ち上げ上昇ホイッスル）
    const whistle = ctx.createOscillator();
    const wGain = ctx.createGain();
    whistle.type = "sine";
    whistle.frequency.setValueAtTime(420, now);
    whistle.frequency.exponentialRampToValueAtTime(1750, now + 0.52);
    wGain.gain.setValueAtTime(0.001, now);
    wGain.gain.exponentialRampToValueAtTime(0.14, now + 0.12);
    wGain.gain.exponentialRampToValueAtTime(0.001, now + 0.56);
    whistle.connect(wGain).connect(ctx.destination);
    whistle.start(now);
    whistle.stop(now + 0.58);

    // 2. 「ド・ドン！」（2連爆発低音＋ノイズバースト）
    const boomOffsets = [0.60, 0.76];
    boomOffsets.forEach((offset, idx) => {
      const t0 = now + offset;
      // 重低音パンチ
      const sub = ctx.createOscillator();
      const sGain = ctx.createGain();
      sub.type = "sine";
      sub.frequency.setValueAtTime(idx === 0 ? 130 : 110, t0);
      sub.frequency.exponentialRampToValueAtTime(32, t0 + 0.35);
      sGain.gain.setValueAtTime(0.001, t0);
      sGain.gain.exponentialRampToValueAtTime(idx === 0 ? 0.34 : 0.42, t0 + 0.02);
      sGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.42);
      sub.connect(sGain).connect(ctx.destination);
      sub.start(t0);
      sub.stop(t0 + 0.45);

      // 花火の炸裂ノイズ
      const bufSize = Math.floor(ctx.sampleRate * 0.45);
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.14));
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(900, t0);
      filter.frequency.exponentialRampToValueAtTime(180, t0 + 0.42);
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(idx === 0 ? 0.25 : 0.32, t0);
      nGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.44);
      noise.connect(filter).connect(nGain).connect(ctx.destination);
      noise.start(t0);
    });
  }catch(e){}
}

/* ===== セーブ＆ロード機能（localStorage ＋ IndexedDB 二重永続化） ===== */
const LS_KEY = 'KazoekataCardZukan_save_v1';
const DB_NAME = 'KazoekataCardZukanDB';
const DB_VER = 1;
const STORE_NAME = 'progressStore';
const RECORD_KEY = 'saveData_v1';

let dbInstance = null;
let isLoaded = false;

/* ゲーム状態 */
let ownedCards = [];                              // ゲットしたカードID（0〜49）
let cleared = new Array(TOTAL_COUNT).fill(false); // 現在の周回で1発クリアしたか
let queue = [];                                   // 残りの出題キュー（{ id: number, isReviewDummy?: boolean }）
let isRechallenge = false;                        // 50枚コンプリート後の「さいチャレンジ」中か

/* 現在の問題の状態 */
let currentItemObj = null;
let currentCorrect = "";
let currentOptions = [];
let wrongInCurrentQ = false;
let isAdvancing = false;

function buildFreshQueue(){
  return shuffle(ITEMS.map((_, i) => i)).map(id => ({ id, isReviewDummy: false }));
}

function openDB(){
  if(dbInstance) return Promise.resolve(dbInstance);
  return new Promise((resolve, reject) => {
    if(typeof indexedDB === 'undefined') return reject(new Error('No IndexedDB'));
    let settled = false;
    const timer = setTimeout(() => { if(!settled){ settled = true; reject(new Error('DB timeout')); } }, 1200);
    try{
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = e => {
        if(settled){ e.target.result.close(); return; }
        settled = true; clearTimeout(timer);
        dbInstance = e.target.result;
        resolve(dbInstance);
      };
      req.onerror = e => { if(!settled){ settled = true; clearTimeout(timer); reject(e.target.error); } };
    }catch(err){ clearTimeout(timer); reject(err); }
  });
}

function makeSnapshot(){
  return {
    ownedCards: Array.from(new Set(ownedCards)),
    cleared: cleared.slice(0, TOTAL_COUNT).map(Boolean),
    queue: queue.map(q => ({ id: q.id, isReviewDummy: !!q.isReviewDummy })),
    isRechallenge: !!isRechallenge,
    rubyOn: !!rubyOn,
    soundOn: !!soundOn,
    updatedAt: Date.now()
  };
}

function saveProgress(){
  if(!isLoaded) return;
  const snap = makeSnapshot();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(snap)); }catch(e){}
  try{ window.name = JSON.stringify({ [RECORD_KEY]: snap }); }catch(e){}
  openDB().then(db => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(snap, RECORD_KEY);
  }).catch(()=>{});
}

function applySnapshot(data){
  if(!data || typeof data !== 'object') return false;
  if(Array.isArray(data.ownedCards)){
    ownedCards = Array.from(new Set(data.ownedCards.filter(n => Number.isInteger(n) && n >= 0 && n < TOTAL_COUNT)));
  }
  if(Array.isArray(data.cleared) && data.cleared.length === TOTAL_COUNT){
    cleared = data.cleared.map(Boolean);
  }
  if(Array.isArray(data.queue)){
    queue = data.queue
      .filter(q => q && Number.isInteger(q.id) && q.id >= 0 && q.id < TOTAL_COUNT)
      .map(q => ({ id: q.id, isReviewDummy: !!q.isReviewDummy }));
  }
  if(typeof data.isRechallenge === 'boolean') isRechallenge = data.isRechallenge;
  if(typeof data.rubyOn === 'boolean') rubyOn = data.rubyOn;
  if(typeof data.soundOn === 'boolean') soundOn = data.soundOn;
  return true;
}

async function loadProgress(){
  let lsData = null, idbData = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) lsData = JSON.parse(raw);
  }catch(e){}
  try{
    const db = await openDB();
    idbData = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(RECORD_KEY);
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }catch(e){}

  let chosen = null;
  if(lsData && idbData){
    chosen = (lsData.updatedAt || 0) >= (idbData.updatedAt || 0) ? lsData : idbData;
  } else {
    chosen = lsData || idbData;
  }
  if(!chosen){
    try{
      if(window.name && window.name.startsWith('{')){
        const parsed = JSON.parse(window.name);
        if(parsed && parsed[RECORD_KEY]) chosen = parsed[RECORD_KEY];
      }
    }catch(e){}
  }

  if(chosen){
    applySnapshot(chosen);
  }

  // キューが空で未クリア問題がある場合は補充
  if(queue.length === 0){
    const unclearedIds = ITEMS.map((_, i) => i).filter(i => !cleared[i]);
    if(unclearedIds.length > 0){
      queue = shuffle(unclearedIds).map(id => ({ id, isReviewDummy: false }));
    } else if(ownedCards.length < TOTAL_COUNT){
      const unownedIds = ITEMS.map((_, i) => i).filter(i => !ownedCards.includes(i));
      queue = shuffle(unownedIds).map(id => ({ id, isReviewDummy: false }));
    }
  }

  isLoaded = true;
  saveProgress();
}

/* ===== クイズ生成・描画 ===== */
function makeChoicesForItem(item){
  const [, , answers, avoid] = item;
  const correct = answers[Math.floor(Math.random() * answers.length)];
  const ansReads = answers.map(a => READ[a]);
  const usedReads = new Set([READ[correct]]);
  const pool = shuffle(ALL_COUNTERS.filter(c =>
    !answers.includes(c) && !avoid.includes(c) && !ansReads.includes(READ[c])
  ));
  const picks = [];
  for(const c of pool){
    if(picks.length >= 3) break;
    if(usedReads.has(READ[c])) continue;
    usedReads.add(READ[c]);
    picks.push(c);
  }
  return { correct, options: shuffle([correct, ...picks]) };
}

function startOrContinueQuiz(){
  // 50枚全達成済みで「さいチャレンジ」前の場合はお祝い画面へ
  if(ownedCards.length === TOTAL_COUNT && !isRechallenge && cleared.every(Boolean)){
    startCelebration();
    return;
  }

  if(queue.length === 0){
    cleared = new Array(TOTAL_COUNT).fill(false);
    queue = buildFreshQueue();
    saveProgress();
  }

  showScreen("quiz");
  renderCurrentQuestion();
}

function renderCurrentQuestion(){
  isAdvancing = false;
  wrongInCurrentQ = false;

  if(queue.length === 0){
    if(ownedCards.length === TOTAL_COUNT && !isRechallenge){
      startCelebration();
    } else {
      isRechallenge = false;
      startCelebration();
    }
    return;
  }

  currentItemObj = queue[0];
  const item = ITEMS[currentItemObj.id];
  const choiceData = makeChoicesForItem(item);
  currentCorrect = choiceData.correct;
  currentOptions = choiceData.options;

  const clearedCount = cleared.filter(Boolean).length;
  const displayNum = Math.min(clearedCount + 1, TOTAL_COUNT);
  $("qnum").textContent = `${displayNum} / ${TOTAL_COUNT}もんめ`;
  $("bar").style.width = `${(clearedCount / TOTAL_COUNT) * 100}%`;

  $("retryTag").style.display = currentItemObj.isReviewDummy ? "inline-block" : "none";
  $("qEmoji").innerHTML = icon(item[0]);
  $("qName").innerHTML = nameHTML(item[1]);
  $("wrongBanner").classList.remove("show");

  renderChoiceButtons();
}

function renderChoiceButtons(){

  currentOptions.forEach(c => {

    b.addEventListener("click", () => handleChoiceClick(b, c));
    box.appendChild(b);
  });
}

/* 4択の並び順を必ず以前と変わるようにシャッフル */
function reshuffleCurrentChoices(){
  if(currentOptions.length <= 1) return;
  const prev = currentOptions.join(",");
  let nextOpts = shuffle(currentOptions);
  let guard = 0;
  while(nextOpts.join(",") === prev && guard < 10){
    nextOpts = shuffle(currentOptions);
    guard++;
  }
  currentOptions = nextOpts;
  renderChoiceButtons();
}

function handleChoiceClick(btn, chosen){
  if(isAdvancing) return;

  if(chosen === currentCorrect){
    /* ===== 正解時の処理 ===== */
    isAdvancing = true;
    sndOK();
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
      if(b.dataset.c === currentCorrect){
        b.classList.add("correct");
        b.insertAdjacentHTML("beforeend", '<span class="mark">⭕</span>');
      }
    });

    const finishedQ = queue.shift(); // 先頭を取り出す
    const qId = finishedQ.id;

    if(wrongInCurrentQ){
      /* 途中で1回でも間違えていた場合：クリアにならず、2問以上後に再出題！ */
      // 間に最低2問挟めるよう、残りの問題数が2問未満ならクリア済みから復習問題を補充する
      if(queue.length < 2){
        const clearedPool = shuffle(
          ITEMS.map((_, i) => i).filter(i => cleared[i] && i !== qId && !queue.some(q => q.id === i))
        );
        while(queue.length < 2 && clearedPool.length > 0){
          queue.push({ id: clearedPool.pop(), isReviewDummy: true });
        }
      }
      // 2問以上後（インデックス2以上、つまり間に2問以上挟む位置）へ挿入
      const minInsertIdx = Math.min(2, queue.length);
      const maxInsertIdx = Math.min(4, queue.length);
      const insertPos = minInsertIdx + Math.floor(Math.random() * (maxInsertIdx - minInsertIdx + 1));
      queue.splice(insertPos, 0, { id: qId, isReviewDummy: false });

      saveProgress();
      updateAllBadges();

      setTimeout(() => {
        showRetryNoticeModal(qId);
      }, 420);

    } else {
      /* 1発正解（間違えずにクリア）の場合：クリア確定＆かぞえかたカード獲得！ */
      if(!finishedQ.isReviewDummy){
        cleared[qId] = true;
      }
      if(!ownedCards.includes(qId)){
        ownedCards.push(qId);
      }

      saveProgress();
      updateAllBadges();

      setTimeout(() => {
        showCardGetModal(qId);
      }, 420);
    }

  } else {
    /* ===== 誤答時の処理 ===== */
    // 1. ブブッと音がする
    sndBufu();
    wrongInCurrentQ = true;

    // 2. 画面が揺れる
    const root = $("appRoot");
    root.classList.remove("shake-screen");
    void root.offsetWidth; // reflow
    root.classList.add("shake-screen");

    // 選んだボタンを一瞬赤く表示＆メッセージ表示
    btn.classList.add("wrong");
    btn.insertAdjacentHTML("beforeend", '<span class="mark">❌</span>');
    $("wrongBanner").classList.add("show");

    // 3. 4択の位置が変わる（正解するまで選択肢を選び続ける）
    document.querySelectorAll(".choice").forEach(b => b.disabled = true);
    setTimeout(() => {
      reshuffleCurrentChoices();
    }, 380);
  }
}

/* ===== 50枚コンプリート ド派手お祝い演出（7色高速背景・紙吹雪・花火・音） ===== */
let fxAnimId = null;
let fireworkSoundTimer = null;

function resizeFxCanvas(){
  const c = $("fxCanvas");
  c.width = window.innerWidth;
  c.height = window.innerHeight;
}
window.addEventListener("resize", resizeFxCanvas);

function startCelebration(){
  showScreen("celebrate");
  document.body.classList.add("celebrate-rainbow");
  sndGrandFanfare();
  startFireworksAndConfetti();
}

function stopCelebration(){
  document.body.classList.remove("celebrate-rainbow");
  if(fxAnimId){ cancelAnimationFrame(fxAnimId); fxAnimId = null; }
  if(fireworkSoundTimer){ clearInterval(fireworkSoundTimer); fireworkSoundTimer = null; }
  const c = $("fxCanvas");
  const ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
}

function startFireworksAndConfetti(){
  resizeFxCanvas();
  const canvas = $("fxCanvas");
  const ctx = canvas.getContext("2d");

  const palette = ["#ff3b30","#ff9500","#ffcc00","#34c759","#00c7be","#007aff","#af52de","#ffffff","#ff2d55"];
  const confetti = [];
  for(let i = 0; i < 180; i++){
    confetti.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: 8 + Math.random() * 8,
      h: 12 + Math.random() * 10,
      color: palette[i % palette.length],
      vx: (Math.random() - 0.5) * 3,
      vy: 2.5 + Math.random() * 4.5,
      rot: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 14
    });
  }

  const rockets = [];
  const sparks = [];

  function launchRocket(withSound){
    const startX = canvas.width * (0.15 + Math.random() * 0.7);
    const targetY = canvas.height * (0.14 + Math.random() * 0.34);
    const color = palette[Math.floor(Math.random() * palette.length)];
    rockets.push({
      x: startX,
      y: canvas.height + 10,
      targetY,
      vy: -(canvas.height - targetY) / 36, // 約0.6秒（36フレーム）で頂点へ到達
      color
    });
    if(withSound) sndFirework();
  }

  function explodeFirework(x, y, mainColor){
    const count = 65;
    const subColor = palette[Math.floor(Math.random() * palette.length)];
    for(let i = 0; i < count; i++){
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.15;
      const speed = 2.5 + Math.random() * 7.5;
      sparks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        decay: 0.014 + Math.random() * 0.015,
        size: 2.5 + Math.random() * 3.5,
        color: i % 3 === 0 ? subColor : mainColor
      });
    }
  }

  // 最初の打ち上げ
  setTimeout(() => launchRocket(true), 250);
  setTimeout(() => launchRocket(false), 600);

  // 定期的に花火を何発も打ち上げる
  let shotCount = 0;
  fireworkSoundTimer = setInterval(() => {
    shotCount++;
    launchRocket(shotCount <= 10); // 最初の10発は「ヒューッ、ドドン！」音付き
    if(shotCount % 2 === 0){
      setTimeout(() => launchRocket(false), 220);
    }
  }, 1150);

  function loop(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 紙吹雪の描画・更新
    for(const p of confetti){
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vRot;
      if(p.y > canvas.height + 20){
        p.y = -20;
        p.x = Math.random() * canvas.width;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }

    // 打ち上げ花火（上昇光）
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.y += r.vy;
      ctx.save();
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = r.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if(r.y <= r.targetY){
        explodeFirework(r.x, r.y, r.color);
        rockets.splice(i, 1);
      }
    }

    // 花火の火花
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.08; // 重力
      s.vx *= 0.98;
      s.vy *= 0.98;
      s.alpha -= s.decay;
      if(s.alpha <= 0){
        sparks.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = s.color;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    fxAnimId = requestAnimationFrame(loop);
  }
  loop();
}

/* 「さいチャレンジ」：50枚のカードは所有したまま、クイズを最初から再スタート */
$("rechallengeBtn").addEventListener("click", () => {
  sndTap();
  stopCelebration();
  cleared = new Array(TOTAL_COUNT).fill(false);
  queue = buildFreshQueue();
  isRechallenge = true;
  saveProgress();
  updateAllBadges();
  showScreen("quiz");
  renderCurrentQuestion();
});

/* ===== ナビゲーション＆トグル設定 ===== */
$("continueBtn").addEventListener("click", () => {
  sndTap();
  startOrContinueQuiz();
});

$("homeBtn").addEventListener("click", () => {
  sndTap();
  updateAllBadges();
  showScreen("start");
});

function syncToggles(){
  $("tgRuby").classList.toggle("on", rubyOn);
  document.body.classList.toggle("no-ruby", !rubyOn);
  $("tgSound").classList.toggle("on", soundOn);
}

$("tgRuby").addEventListener("click", () => {
  rubyOn = !rubyOn;
  syncToggles();
  saveProgress();
  sndTap();
});

$("tgSound").addEventListener("click", () => {
  soundOn = !soundOn;
  syncToggles();
  saveProgress();
  sndTap();
});

/* ===== 起動時のロード＆ページ離脱時オートセーブ ===== */
window.addEventListener("DOMContentLoaded", async () => {
  await loadProgress();
  syncToggles();
  updateAllBadges();
});

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") saveProgress();
});
window.addEventListener("pagehide", saveProgress);
window.addEventListener("beforeunload", saveProgress);
</script>
